name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Playwright (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # Postgres como service container: Docker lo levanta antes que corran los
    # steps y lo tira abajo al terminar el job. Mapeado a 5433 para calcar el
    # docker-compose.yml de desarrollo local (docker-compose.yml, .env.example).
    #
    # ${{ secrets.X || 'default' }}: si el repo/org configuró el secret, se
    # usa ese valor; si no, cae al mismo default de .env.example. Esto NO es
    # una degradación de seguridad, es reconocer qué es un secreto acá y qué
    # no lo es:
    #
    #   - Este Postgres es un contenedor efímero: Docker lo crea al arrancar
    #     el job y lo destruye al terminar. No persiste entre corridas, no
    #     tiene datos reales (los siembra sut/seed.ts con fixtures
    #     determinísticos) y no es alcanzable desde fuera del runner de esa
    #     corrida — ni por otro job, ni por internet.
    #   - TEST_USER/TEST_PASSWORD son literalmente el usuario y contraseña
    #     que sut/seed.ts hardcodea en el repo público. JWT_SECRET por
    #     default es "ci_only_not_a_real_secret", nombrado así a propósito.
    #     Ya están en texto plano en .env.example, en el mismo commit que
    #     este workflow.
    #
    # Poner estos valores como GitHub Secrets no agrega protección real —
    # no hay nada detrás que proteger, y el valor "secreto" ya es público en
    # el propio repo — solo agrega un paso de configuración manual que, si
    # se salta (como pasó acá: el CI fallaba por secrets sin configurar),
    # tira abajo el pipeline por nada. Eso es teatro de seguridad: el ritual
    # de "secretizar" sin un modelo de amenaza real detrás.
    #
    # Si el día de mañana esto corre contra un Postgres compartido/persistente
    # con datos reales, o contra un JWT_SECRET que además firma tokens fuera
    # de CI, ahí sí son secretos de verdad y el fallback tiene que desaparecer
    # (forzar que el secret exista, no cubrirlo con un default).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.DB_USER || 'cbq' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'cbq_local' }}
          POSTGRES_DB: ${{ secrets.DB_NAME || 'core_banking' }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Credenciales del Postgres efímero del job: no son secretos, el
      # contenedor nace y muere dentro del runner. Se dejan como defaults
      # para que el CI corra sin configuración previa, con override por
      # secrets si algún entorno lo requiere. Los secrets se reservan para
      # lo que da acceso a un recurso real.
      DATABASE_URL: postgresql://${{ secrets.DB_USER || 'cbq' }}:${{ secrets.DB_PASSWORD || 'cbq_local' }}@localhost:5433/${{ secrets.DB_NAME || 'core_banking' }}
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:3000/api
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_only_not_a_real_secret' }}
      TEST_USER: ${{ secrets.TEST_USER || 'alice@bank.local' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'Passw0rd!' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts corre sut:migrate + sut:seed dentro del project
      # "setup" (tests/setup/sut-ready.setup.ts), y levanta el SUT solo
      # (webServer) porque reuseExistingServer es false con CI=true. No hace
      # falta ningún step manual para arrancar la app acá.
      #
      # Nota de sharding: el project "setup" tiene dependents en los otros
      # cuatro projects (ui/api/db/db-known-bug vía `dependencies`), así que
      # Playwright lo re-resuelve en cada shard que lo necesite: cada shard
      # migra y siembra su propia base (cada uno tiene su propio service
      # container, aislados entre sí por job), no hay estado compartido entre
      # shards.
      - name: Run Playwright tests
        run: npm test -- --shard=${{ matrix.shard }}/2

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      # blob-report/ es el formato pensado para fusionarse: bajando los 2
      # artifacts de esta matrix y corriendo
      # `npx playwright merge-reports --reporter=html ./blob-reports`
      # se obtiene un único playwright-report/ con los 23 tests de ambos
      # shards, en vez de dos reportes HTML parciales. Ese merge no está
      # armado acá como job aparte porque no se pidió, pero es el paso
      # natural siguiente.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
