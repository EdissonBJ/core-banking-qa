name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Playwright (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # Postgres como service container: Docker lo levanta antes que corran los
    # steps y lo tira abajo al terminar el job. Mapeado a 5433 para calcar el
    # docker-compose.yml de desarrollo local (docker-compose.yml, .env.example).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Nada hardcodeado: todo lo sensible sale de secrets del repo/organización.
    # sut/README.md documenta el mismo contrato de variables para desarrollo
    # local vía .env.
    env:
      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5433/${{ secrets.DB_NAME }}
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:3000/api
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts corre sut:migrate + sut:seed dentro del project
      # "setup" (tests/setup/sut-ready.setup.ts), y levanta el SUT solo
      # (webServer) porque reuseExistingServer es false con CI=true. No hace
      # falta ningún step manual para arrancar la app acá.
      #
      # Nota de sharding: el project "setup" tiene dependents en los otros
      # cuatro projects (ui/api/db/db-known-bug vía `dependencies`), así que
      # Playwright lo re-resuelve en cada shard que lo necesite: cada shard
      # migra y siembra su propia base (cada uno tiene su propio service
      # container, aislados entre sí por job), no hay estado compartido entre
      # shards.
      - name: Run Playwright tests
        run: npm test -- --shard=${{ matrix.shard }}/2

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      # blob-report/ es el formato pensado para fusionarse: bajando los 2
      # artifacts de esta matrix y corriendo
      # `npx playwright merge-reports --reporter=html ./blob-reports`
      # se obtiene un único playwright-report/ con los 23 tests de ambos
      # shards, en vez de dos reportes HTML parciales. Ese merge no está
      # armado acá como job aparte porque no se pidió, pero es el paso
      # natural siguiente.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
