services:
  db:
    image: postgres:16-alpine
    container_name: cbq-postgres
    environment:
      POSTGRES_USER: cbq
      POSTGRES_PASSWORD: cbq_local
      POSTGRES_DB: core_banking
    ports:
      - "5433:5432"
    volumes:
      - cbq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbq -d core_banking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cbq_pgdata: